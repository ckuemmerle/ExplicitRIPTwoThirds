related_formalizations: []

status:
  scope: >-
    Every numbered theorem, proposition and lemma of the paper, and every definition and
    unnumbered statement that they use, has an exact Lean counterpart (a frozen statement in
    ExplicitRIP/Frozen/, one declaration per file), and every frozen theorem is proved from
    Mathlib without sorry; PAPER_MAP.md lists the correspondence. This includes Zahl's sphere
    tangency theorem (Theorem 6), which the paper quotes, together with the part of the
    Guth-Zahl structure theorem that its proof needs. The Challenge compares Theorem 1,
    Theorem 4, Proposition 10 and the application of Proposition 10 to the matrices of
    Theorem 1. Not formalized: the running-time claims for the construction (the matrices are
    given by explicit definitions, but no complexity bound is proved), the background results
    of the introduction other than the Welch bound, heuristic remarks, and the open Problem 9.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "KM.main_theorem"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "KM.unsigned_barrier"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "KM.construction_barrier"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "KM.construction_barrier_host"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5", "GPT-6.1 Sol", "GPT-6 Astra"]
      framework: "Claude Code (orchestrating agent and subagents) and Codex CLI"
      tool_setup: >-
        An orchestrating agent (Claude Opus 5.5 in Claude Code) drafted every frozen statement
        from the paper and had it audited against the paper by an independent agent. Other
        agents (Claude subagents, and Codex CLI agents running GPT-6.1 Sol and GPT-6 Astra)
        wrote the proofs in sandboxed copies of the project and audited them; the integrated
        development was rebuilt and checked for exact statements and axioms. The statement
        package was checked with Comparator (Lean 4.35 `lake comparator`), which replayed the
        exported Solution in NanoDa and in Lean's kernel.
      cost:
        wall_time: "about three and a half days of elapsed time (2026-11-07 to 2026-11-10), agents working in parallel"
        spend_usd: "not tracked"
        hardware: "local machine (Apple silicon)"
  spend_usd: "not tracked"
  notes: >-
    The paper credits GPT-6 Astra with the initial proof of Theorem 1 and ChatGPT with
    exploratory discussions and drafting; its two human authors state that they checked the
    mathematical claims and take responsibility.

fidelity:
  divergences: >-
    (1) As in the paper's footnotes 3 and 4, the frame of Theorem 1 is the Cholesky factor of
    the host Gram matrix in lexicographic vertex order with the zero rows of zero pivots
    deleted, computed by exact LDLᵀ elimination over ℚ, and F_p^3 is identified with F_{p^3}
    through the power basis of the lexicographically first monic irreducible cubic.
    (2) "Explicit" is represented by these concrete definitions; no running-time bound is
    formalized. (3) Theorem 1 is stated for the parameters of its proof (primes
    p ≡ 3 (mod 4), T = {0, …, ⌊log p⌋ - 1}, k = ⌊p²/(log p)⁶⌋), with every limit as an
    explicit ε-P statement; it additionally states k ≤ m^{2/3}. (4) Theorem 4's asymptotic
    clause assumes the theorem's hypotheses eventually along the sequence. (5) Proposition 10,
    which the paper states for sequences, is read with "for all sufficiently large m" as
    eventually in j, uniformly in 1 ≤ k ≤ n_j, "μ ≳ m^{-1/3}" as μ_j ≥ C m_j^{-1/3}
    eventually for some C > 0, and eventually nonempty selections; two-distance tight frames
    follow the paper's definition (a ≠ b, unit diagonal, off-diagonal entries in {a, b},
    ΦΦ* = cI). Lemma 5 keeps the standing assumption of Section 3 that the graph and its
    complement are connected. (6) The application to Theorem 1 is stated for every real matrix
    with (p - 1)(p² + 1) rows whose Gram matrix is a principal submatrix of the host Gram
    matrix; the matrices of Theorem 1 are of this form up to relabeling their rows.
    (7) Outside the compared statements, Zahl's notions of pencils and complementary conics
    follow Zahl's paper, whose definitions are more precise than the paper's paraphrase.
    (8) All asymptotic conclusions concern sufficiently large parameters; small-parameter
    values use Lean's total conventions for natural floors, log 0, square roots and division by
    zero. The generic LDLᵀ formulas are asserted to be Cholesky factorizations only for
    positive semidefinite inputs.

review:
  status: "agent-reviewed"
  reviewers:
