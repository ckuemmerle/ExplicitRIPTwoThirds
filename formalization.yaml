    id: "arXiv:1503.02173"
    location: "Theorem 3.8; American Journal of Mathematics 140 (2018), no. 5, 1187-1229"
    author_endorsement: not-contacted
    note: >-
      Zahl's proof uses this structure theorem for lines. The development proves the case that
