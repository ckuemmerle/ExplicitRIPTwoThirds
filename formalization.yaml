# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, following the Palomar registry conventions (https://palomar-registry.org).
version: "v0.4"

project:
  name: "Explicit restricted isometries with k = m^{2/3-o(1)}"
  description: >-
    Lean 4 / Mathlib formalization of the paper "Explicit restricted isometries with
    k = m^{2/3-o(1)}" by Christian Kümmerle and Dustin G. Mixon. Restricted isometry measures
    how well a matrix preserves the lengths of sparse vectors; deterministic constructions are
    studied as measurement matrices for sparse recovery in compressed sensing. The principal result
    (Theorem 1) is an explicit family of real m × n matrices with unit-norm columns such
    that m → ∞, m/n → 0 and the restricted isometry constant δ_k → 0 for
    k = m^{2/3-o(1)}, beyond the square-root barrier of coherence arguments; the proof uses
    no phase cancellation. The matrices are subframes of a real unit-norm two-distance tight
    frame obtained from the strongly regular graph VO₄⁻(p), p ≡ 3 (mod 4): the columns are
    indexed by translates of the graph of the field norm of F_{p³}/F_p. The proof combines
    Gershgorin's circle theorem with a flat restricted isometry estimate, which reduces the
    problem to the density of subgraphs, and Zahl's bound for sphere tangencies over finite
    fields, which the development proves from Mathlib. The compared statements also contain
    the 2/3 barrier for arguments that ignore the signs of the Gram entries (Theorem 4), its
    analogue for subframes of two-distance tight frames even with phase cancellation
    (Proposition 10), and the consequence that the matrices of Theorem 1 do not break the 2/3
    barrier. Every numbered theorem, lemma and proposition of the paper is proved in the development.
  authors:
    - "Christian Kümmerle"
  responsible_maintainers:
    - "Christian Kümmerle"
  license: "Apache-2.0"

classification:
  arxiv: [cs.IT, math.CO]
  msc2020: [94A12, 42C15, 05E30, 52C10, 15A60]

