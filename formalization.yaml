    - source: "Theorem 4"
      lean: "KM.unsigned_barrier"
      module: "Solution"
      status: "proved"
      note: "Proved by ExplicitRIP.unsigned_barrier; see fidelity (4). The matching statement of record is in Challenge."
    - source: "Proposition 10"
      lean: "KM.construction_barrier"
      module: "Solution"
      status: "proved"
      note: "Proved by ExplicitRIP.construction_barrier; see fidelity (5). The matching statement of record is in Challenge."
    - source: "Abstract and Section 5: the matrices of Theorem 1 do not break the 2/3 barrier"
